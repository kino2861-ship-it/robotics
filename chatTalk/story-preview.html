<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNI 会話プレビュー</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #24382d; background: #eef3f0; font: 15px/1.6 system-ui, sans-serif; }
      .preview-shell { width: min(880px, 100%); min-height: 100dvh; margin: auto; background: #fff; display: flex; flex-direction: column; }
      header { padding: 20px; border-bottom: 1px solid #e3eae5; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .note { margin: 0 0 15px; color: #64746a; font-size: 13px; }
      label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 700; }
      select { width: 100%; padding: 10px 12px; border: 1px solid #cfded2; border-radius: 8px; background: #fff; color: inherit; font: inherit; }
      main { flex: 1; padding: 20px; background: #c3d5df; }
      .scene-heading { margin: 0 auto 18px; width: fit-content; padding: 4px 12px; border-radius: 12px; background: #f6faf9; color: #49616c; font-size: 12px; }
      .bubble { max-width: min(78%, 560px); width: fit-content; margin: 0 auto 12px 0; padding: 10px 14px; border-radius: 15px; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble.mine { margin: 0 0 12px auto; background: #a9ee8e; }
      .bubble.image { min-width: 180px; min-height: 90px; border: 1px dashed #bbcfc0; background: #f8faf9; display: grid; place-items: center; color: #62756a; }
      .timing { margin: 0 0 18px; color: #4d6571; font-size: 12px; }
      .variant-switch { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
      .variant-switch button[aria-pressed="true"] { border-color: #158b4b; background: #d6f2df; }
      footer { padding: 16px 20px 22px; border-top: 1px solid #dbe6df; }
      .next-heading { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
      .choices { display: flex; flex-wrap: wrap; gap: 8px; }
      button { padding: 9px 13px; border: 1px solid #b8dcc1; border-radius: 9px; background: #f1fbf3; color: #216a39; font: inherit; text-align: left; cursor: pointer; }
      button:hover { background: #dcf4e2; }
      .error { color: #a12b2b; }
    </style>
    <script src="./uni-story.js" defer></script>
    <script src="./story-compiler.js" defer></script>
    <script src="./story-preview.js" defer></script>
  </head>
  <body>
    <div class="preview-shell">
      <header>
        <h1>UNI 会話プレビュー</h1>
        <p class="note">場面を選ぶと、会話文と次の選択肢を待ち時間なしで確認できます。ここでの操作は本編の履歴に保存されません。</p>
        <label for="scene-select">確認する場面</label>
        <select id="scene-select"></select>
      </header>
      <main id="scene-content" aria-live="polite"></main>
      <footer>
        <p class="next-heading">次の選択肢</p>
        <div id="next-choices" class="choices"></div>
      </footer>
    </div>
  </body>
</html>
